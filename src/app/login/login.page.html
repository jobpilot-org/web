<main class="login">
  <header class="header">
    <h1 class="title">jobpilot<span class="jp-brand__dot">.</span></h1>
    <p class="lead jp-muted">Bitte melde dich an.</p>
  </header>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label class="jp-field">
      <span class="jp-field__label">E-Mail</span>
      <input class="jp-input" type="email" formControlName="email" autocomplete="email" />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <span class="jp-field__message">
          @if (form.controls.email.hasError('required')) {
            Bitte E-Mail-Adresse eingeben
          } @else {
            Bitte eine gültige E-Mail-Adresse eingeben
          }
        </span>
      }
    </label>

    <label class="jp-field">
      <span class="jp-field__label">Passwort</span>
      <input
        class="jp-input"
        type="password"
        formControlName="password"
        autocomplete="current-password"
      />
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <span class="jp-field__message">Bitte Passwort eingeben</span>
      }
    </label>

    @if (error(); as message) {
      <p class="failed jp-error" role="alert">{{ message }}</p>
    }

    <button class="jp-button submit" type="submit" [disabled]="isSubmitting()">
      {{ isSubmitting() ? 'Anmelden …' : 'Anmelden' }}
    </button>
  </form>
</main>
